name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/FlexComDotnet/FlexComDotnet.csproj

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^[vV]', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $changelogPath = "CHANGELOG.md"
          
          if (-not (Test-Path $changelogPath)) {
            Write-Error "CHANGELOG.md not found!"
            exit 1
          }
          
          $content = Get-Content $changelogPath -Raw
          
          # 匹配版本标题 (支持 v1.0.0 或 1.0.0 格式)
          $escapedVersion = [regex]::Escape($version)
          $pattern = '(?ms)^#\s*v?' + $escapedVersion + '\s*$(.+?)(?=^#\s*v?\d+\.\d+\.\d+|\z)'
          
          if ($content -match $pattern) {
            $releaseNotes = $Matches[1].Trim()
            
            # 写入到文件以便后续步骤使用
            $releaseNotes | Out-File -FilePath "RELEASE_NOTES.md" -Encoding utf8
            
            Write-Host "Release notes extracted successfully:"
            Write-Host $releaseNotes
          } else {
            Write-Error "Version $version not found in CHANGELOG.md! Please add changelog entry before releasing."
            exit 1
          }

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o ./publish/portable

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipName = "FlexComDotnet_$version.zip"
          
          Compress-Archive -Path ./publish/portable/* -DestinationPath "./publish/$zipName" -Force
          
          Write-Host "Created: $zipName"

      - name: Build MSIX package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          
          # 重新发布用于 MSIX 打包
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$version `
            -o ./publish/msix-content
          
          # 创建 MSIX 打包所需的 AppxManifest.xml
          $manifestContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="FlexComDotnet"
                      Publisher="CN=FlexComDotnet"
                      Version="$version.0"
                      ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>FlexComDotnet</DisplayName>
              <PublisherDisplayName>FlexComDotnet</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Resources>
              <Resource Language="zh-CN" />
              <Resource Language="en-US" />
            </Resources>
            <Applications>
              <Application Id="FlexComDotnet" Executable="FlexComDotnet.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="FlexComDotnet"
                                    Description="串口调试助手"
                                    BackgroundColor="transparent"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
              <Capability Name="internetClient" />
            </Capabilities>
          </Package>
          "@
          
          # 创建 Assets 目录
          $assetsPath = "./publish/msix-content/Assets"
          New-Item -ItemType Directory -Force -Path $assetsPath | Out-Null
          
          # 从应用图标生成所需的 PNG 文件
          $iconPath = "src/FlexComDotnet/app_icon.ico"
          
          if (Test-Path $iconPath) {
            Write-Host "Converting app_icon.ico to PNG assets..."
            
            # 使用 .NET 加载并转换图标
            Add-Type -AssemblyName System.Drawing
            $icon = [System.Drawing.Icon]::new($iconPath)
            
            # 为不同尺寸创建 PNG 文件
            $sizes = @{
              "StoreLogo.png" = 50
              "Square44x44Logo.png" = 44
              "Square150x150Logo.png" = 150
              "Wide310x150Logo.png" = 310
            }
            
            foreach ($file in $sizes.Keys) {
              $size = $sizes[$file]
              $bitmap = [System.Drawing.Bitmap]::new($size, $size)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $graphics.DrawImage($icon.ToBitmap(), 0, 0, $size, $size)
              $bitmap.Save("$assetsPath/$file", [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $bitmap.Dispose()
            }
            
            $icon.Dispose()
            Write-Host "PNG assets created successfully"
          } else {
            Write-Warning "app_icon.ico not found, using placeholder images"
            # 创建简单的占位 PNG (1x1 透明像素)
            $pngBytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==")
            @("StoreLogo.png", "Square150x150Logo.png", "Square44x44Logo.png", "Wide310x150Logo.png") | ForEach-Object {
              [IO.File]::WriteAllBytes("$assetsPath/$_", $pngBytes)
            }
          }
          
          $manifestContent | Out-File -FilePath "./publish/msix-content/AppxManifest.xml" -Encoding utf8
          
          # 使用 makeappx 打包 (Windows SDK 自带)
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -Recurse | Select-Object -First 1
          
          if ($makeappx) {
            $msixName = "FlexComDotnet_$version.msix"
            & $makeappx.FullName pack /d ./publish/msix-content /p "./publish/$msixName" /nv
            Write-Host "Created: $msixName"
          } else {
            Write-Warning "makeappx.exe not found, skipping MSIX creation"
          }

      - name: Sign MSIX package
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $msixPath = "./publish/FlexComDotnet_$version.msix"
          
          # 检查证书是否配置
          if ([string]::IsNullOrEmpty($env:SIGNING_CERT)) {
            Write-Warning "SIGNING_CERT not configured, skipping MSIX signing"
            exit 0
          }
          
          # 解码证书并保存到临时文件
          $certBase64 = $env:SIGNING_CERT
          $certBytes = [Convert]::FromBase64String($certBase64)
          $certPath = "./temp_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          
          Write-Host "Certificate saved to temporary file"
          
          # 查找 signtool
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -Recurse | 
                      Sort-Object -Property FullName -Descending | 
                      Select-Object -First 1
          
          if ($signtool) {
            Write-Host "Signing MSIX with signtool: $($signtool.FullName)"
            
            # 签名 MSIX 包
            & $signtool.FullName sign `
              /fd SHA256 `
              /a `
              /f $certPath `
              /p $env:SIGNING_CERT_PASSWORD `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              $msixPath
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MSIX package signed successfully"
            } else {
              Write-Error "Failed to sign MSIX package"
              exit 1
            }
          } else {
            Write-Error "signtool.exe not found in Windows SDK"
            exit 1
          }
          
          # 清理临时证书文件
          Remove-Item $certPath -Force
          Write-Host "Temporary certificate file removed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ./publish/FlexComDotnet_${{ steps.version.outputs.VERSION }}.zip
            ./publish/FlexComDotnet_${{ steps.version.outputs.VERSION }}.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
