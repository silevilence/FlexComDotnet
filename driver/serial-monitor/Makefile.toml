# Makefile.toml — cargo-make driver build tasks
#
# Usage:
#   cargo make                           # Debug build + package
#   cargo make default --release         # Release build + package
#
# Prerequisites:
#   1. WDK or eWDK installed
#   2. Running from an eWDK developer prompt
#   3. cargo-make installed: cargo install --locked cargo-make --no-default-features --features tls-native
#   4. LLVM 17 for bindgen: winget install -i LLVM.LLVM --version 17.0.6
#
# Output:
#   target/<profile>/package/serial_monitor.sys   — Signed driver binary
#   target/<profile>/package/serial_monitor.cat   — Catalog file
#   target/<profile>/package/serial_monitor.inf   — Installation descriptor

# Extend the WDK-provided makefile (generated by wdk-build during cargo build)
extend = "target/rust-driver-makefile.toml"

[config]
load_script = '''
#!@rust
//! ```cargo
//! [dependencies]
//! wdk-build = "0.5.1"
//! ```
#![allow(unused_doc_comments)]

wdk_build::cargo_make::load_rust_driver_makefile()?
'''

[env]
# Pass the kernel feature to all cargo commands
CARGO_MAKE_CARGO_BUILD_TEST_FLAGS = "--features kernel"

[tasks.build-driver]
description = "Build the kernel driver with the kernel feature"
command = "cargo"
args = ["build", "--features", "kernel"]

[tasks.build-driver-release]
description = "Build the kernel driver in release mode"
command = "cargo"
args = ["build", "--features", "kernel", "--release"]
